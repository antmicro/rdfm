services:
  # An example of how a production deployment of RDFM could look like
  # WARNING: DO NOT BLINDLY USE THIS COMPOSE FOR ACTUAL PRODUCTION DEPLOYMENTS!
  # You must configure the secrets (RDFM JWT secret, S3 secret, Keycloak
  # secrets for the introspection client) on your own.
  # FAILURE TO DO SO WILL RESULT IN AN INSECURE DEPLOYMENT
  rdfm-server:
    image: antmicro/rdfm-server:latest
    restart: unless-stopped
    env_file: $SETUP_FILE
    depends_on:
      rustfs-bucket-creator:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    environment:
      - REQUESTS_CA_BUNDLE=/certs/CA.crt
      - RDFM_LOCAL_PACKAGE_DIR=/tmp/
      # Disable encryption, as we're behind a reverse proxy.
      - RDFM_DISABLE_ENCRYPTION=1
      # Alternatively, an HTTPS configuration can be provided:
      # - RDFM_SERVER_CERT=/certs/SERVER.crt
      # - RDFM_SERVER_KEY=/certs/SERVER.key
    networks:
      - rdfm
    volumes:
      - db:/database/
      - ${PWD}/server/deploy/certs:/certs

  nginx:
    image: nginx:1.27.2-alpine
    restart: unless-stopped
    env_file: $SETUP_FILE
    depends_on:
      keycloak:
        condition: service_started
      rdfm-server:
        condition: service_started
      rustfs-bucket-creator:
        condition: service_completed_successfully
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    volumes:
      - ${PWD}/server/deploy/nginx.conf:/etc/nginx/templates/default.conf.template
      - ${PWD}/server/deploy/certs:/etc/nginx/certs/
    networks:
      - rdfm

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    networks:
      - rdfm
    volumes:
      - rustfs-storage:/data
      - rustfs-logs:${RUSTFS_OBS_LOG_DIRECTORY}
    environment:
      - RUSTFS_ACCESS_KEY=${RDFM_S3_ACCESS_KEY_ID}
      - RUSTFS_SECRET_KEY=${RDFM_S3_ACCESS_SECRET_KEY}
      - RUSTFS_ADDRESS=${RUSTFS_ADDRESS}
      - RUSTFS_CONSOLE_ADDRESS=${RUSTFS_CONSOLE_ADDRESS}
      - RUSTFS_CONSOLE_ENABLE=${RUSTFS_CONSOLE_ENABLE}
      - RUSTFS_OBS_LOGGER_LEVEL=${RUSTFS_OBS_LOGGER_LEVEL}
      - RUSTFS_OBS_LOG_DIRECTORY=${RUSTFS_OBS_LOG_DIRECTORY}
      - RUSTFS_OBS_LOG_ROTATION_SIZE_MB=${RUSTFS_OBS_LOG_ROTATION_SIZE_MB}
      - RUSTFS_OBS_LOG_ROTATION_TIME=${RUSTFS_OBS_LOG_ROTATION_TIME}
      - RUSTFS_OBS_LOG_KEEP_FILES=${RUSTFS_OBS_LOG_KEEP_FILES}

  rustfs-bucket-creator:
    image: rustfs/rc:v0.1.35
    restart: on-failure
    env_file: $SETUP_FILE
    depends_on:
      - rustfs
    networks:
      - rdfm
    entrypoint: >
      /bin/sh -c "
        set -e
        /usr/bin/rc alias set rdfm-rustfs ${RDFM_S3_URL} admin admin123;
        /usr/bin/rc bucket create rdfm-rustfs/rdfm-packages --ignore-existing;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    env_file: $SETUP_FILE
    networks:
      - rdfm
    command:
      - start
      - --import-realm
    volumes:
      - ${PWD}/server/deploy/certs:/certs
      - keycloak:/opt/keycloak/data/
      - ${PWD}/server/keycloak-themes/:/opt/keycloak/themes
      - ${PWD}/frontend/public/assets/:/opt/keycloak/themes/rdfm/login/resources/img/
      - ${PWD}/server/deploy/rdfm-realm-template.json:/opt/keycloak/data/import/rdfm-realm.json

  postgres:
    image: postgres:16.2
    env_file: $SETUP_FILE
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - rdfm
    volumes:
      - db:/var/lib/postgresql/data


volumes:
  db:
  keycloak:
  rustfs-storage:
  rustfs-logs:

networks:
  rdfm:
    ipam:
      driver: default
      config:
        - subnet: 172.16.0.0/16
