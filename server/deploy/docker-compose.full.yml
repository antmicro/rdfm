services:
  rdfm-server:
    image: antmicro/rdfm-server:latest
    build:
      dockerfile: server/deploy/Dockerfile
      context: ../../
    restart: unless-stopped
    env_file: $SETUP_FILE
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_started
      rustfs-bucket-creator:
        condition: service_completed_successfully
    environment:
      REQUESTS_CA_BUNDLE: /certs/CA.crt
    networks:
      - rdfm
    volumes:
      - ${PWD}/server/deploy/certs:/certs

  frontend-builder:
    image: antmicro/rdfm-frontend-builder:latest
    env_file: $SETUP_FILE
    volumes:
      - static:/static
    build:
      dockerfile: frontend/Dockerfile
      context: ../../

  frontend:
    image: nginx:1.27.2-alpine
    restart: unless-stopped
    env_file: $SETUP_FILE
    depends_on:
      keycloak:
        condition: service_started
      rdfm-server:
        condition: service_started
      frontend-builder:
        condition: service_completed_successfully
    ports:
      - "${RDFM_FRONTEND_PORT}:${RDFM_FRONTEND_PORT}"
    volumes:
      - ${PWD}/server/deploy/nginx.conf:/etc/nginx/templates/default.conf.template
      - ${PWD}/server/deploy/certs:/etc/nginx/certs/
      - static:/etc/nginx/html
    networks:
      - rdfm

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    env_file: $SETUP_FILE
    networks:
      - rdfm
    command:
      - start
      - --import-realm
    volumes:
      - ${PWD}/server/deploy/certs:/certs
      - keycloak:/opt/keycloak/data/
      - ${PWD}/server/keycloak-themes/:/opt/keycloak/themes
      - ${PWD}/frontend/public/assets/:/opt/keycloak/themes/rdfm/login/resources/img/
      - ${PWD}/server/deploy/rdfm-realm-template.json:/opt/keycloak/data/import/rdfm-realm.json

  postgres:
    image: postgres:16.2
    env_file: $SETUP_FILE
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - rdfm
    volumes:
      - db:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - rdfm
    volumes:
      - rustfs-storage:/data
      - rustfs-logs:/var/log/rustfs/
      - ${PWD}/server/deploy/certs/CA.crt:${RUSTFS_TLS_PATH}/CA.crt:ro
      - ${PWD}/server/deploy/certs/RUSTFS.crt:${RUSTFS_TLS_PATH}/rustfs_cert.pem:ro
      - ${PWD}/server/deploy/certs/RUSTFS.key:${RUSTFS_TLS_PATH}/rustfs_key.pem:ro
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_TLS_PATH=${RUSTFS_TLS_PATH}
      - RUSTFS_ADDRESS=${RUSTFS_ADDRESS}
      - RUSTFS_CONSOLE_ADDRESS=${RUSTFS_CONSOLE_ADDRESS}
      - RUSTFS_CONSOLE_ENABLE=${RUSTFS_CONSOLE_ENABLE}
      - RUSTFS_OBS_LOGGER_LEVEL=${RUSTFS_OBS_LOGGER_LEVEL}
      - RUSTFS_OBS_LOG_DIRECTORY=${RUSTFS_OBS_LOG_DIRECTORY}
      - RUSTFS_OBS_LOG_ROTATION_SIZE_MB=${RUSTFS_OBS_LOG_ROTATION_SIZE_MB}
      - RUSTFS_OBS_LOG_ROTATION_TIME=${RUSTFS_OBS_LOG_ROTATION_TIME}
      - RUSTFS_OBS_LOG_KEEP_FILES=${RUSTFS_OBS_LOG_KEEP_FILES}

  rustfs-bucket-creator:
    image: rustfs/rc:v0.1.35
    restart: on-failure
    depends_on:
      - rustfs
    networks:
      - rdfm
    entrypoint: >
      /bin/sh -c "
        set -e
        /usr/bin/rc alias set rdfm-rustfs ${RDFM_S3_URL} ${RDFM_S3_ACCESS_KEY_ID} ${RDFM_S3_ACCESS_SECRET_KEY} --ca-bundle /certs/CA.crt;
        /usr/bin/rc bucket create rdfm-rustfs/${RDFM_S3_BUCKET} --ignore-existing;
      "
    volumes:
      - ${PWD}/server/deploy/certs/CA.crt:/certs/CA.crt:ro

volumes:
  keycloak:
  rustfs-storage:
  rustfs-logs:
  db:
  static:

networks:
  rdfm:
    ipam:
      driver: default
      config:
        - subnet: 172.16.0.0/16
