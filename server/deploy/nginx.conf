upstream keycloak-internal {
    server keycloak:8443;
}

server {
    listen ${NGINX_PORT} ssl;

    ssl_certificate ${NGINX_CERTIFICATE};
    ssl_certificate_key ${NGINX_CERTIFICATE_KEY};
    server_name ${PUBLIC_ADDRESS}

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions

    client_max_body_size 0;

    proxy_read_timeout 7200;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api {
        proxy_pass ${RDFM_SERVER_INTERNAL_URL};
    }

    location /${RDFM_S3_BUCKET} {
        proxy_pass ${RUSTFS_INTERNAL_URL};
    }

    location / {
        try_files $uri $uri/ /index.html =404;

        # Prevents errors on "header too big" when authenticating
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Reference:
        # https://www.keycloak.org/server/reverseproxy#header-filtering-recommendations
        # > Ensure the proxy overwrites (not just appends to) forwarded headers to prevent clients from injecting false values.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Original-Method "";
        proxy_set_header X-Forwarded-Access-Token "";
        proxy_set_header traceparent "";
        proxy_set_header tracestat "";
        proxy_set_header baggage "";
        proxy_set_header b3 "";
        proxy_set_header x-b3-traceid "";
        proxy_set_header x-b3-spanid "";
        proxy_set_header x-b3-parentspanid "";
        proxy_set_header x-b3-sampled "";
        proxy_set_header x-b3-flags "";
        proxy_set_header uber-trace-id "";
        proxy_set_header x-ot-span-context "";

        # Reference:
        # https://www.keycloak.org/server/reverseproxy#_exposed_path_recommendations
        location ${KC_HTTP_RELATIVE_PATH}/realms {
            client_max_body_size 128m;
            proxy_pass https://keycloak-internal;
        }

        location ${KC_HTTP_RELATIVE_PATH}/resources {
            client_max_body_size 128m;
            proxy_pass https://keycloak-internal;
        }

        location ${KC_HTTP_RELATIVE_PATH}/.well-known {
            client_max_body_size 128m;
            proxy_pass https://keycloak-internal;
        }

        # https://www.keycloak.org/server/reverseproxy#_exposed_path_recommendations
        # > If you configured an http-relative-path on the server,
        # > proceed as follows to use discovery with RFC 8414:
        # > Configure a reverse proxy to map the /.well-known/ path
        # > without the prefix to the path with the prefix on the server.
        location /.well-known {
            proxy_pass https://keycloak-internal${KC_HTTP_RELATIVE_PATH};
        }
    }
}
